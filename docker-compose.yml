services:
    web:
        image: nginx:stable
        container_name: nginx
        ports:
            - 66:80
        volumes:
            - .:/var/www/html
            - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
        restart: always

    php-fpm:
        container_name: php-fpm
        build: ./docker/docker_php
        user: "${UID:-1000}:${GID:-1000}"
        userns_mode: "keep-id"
        environment:
            XDG_CONFIG_HOME: /tmp
        restart: always
#        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
            - ./docker/docker_php/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-xdebug.ini

    postgres:
        image: postgres:15.1
        volumes:
            - postgres_data:/var/lib/postgresql/data
        userns_mode: "keep-id:uid=999,gid=999"
        environment:
            - POSTGRES_USER=${DB_USERNAME}
            - POSTGRES_PASSWORD=${DB_PASSWORD}
            - POSTGRES_DB=${DB_DATABASE}
        ports:
            - 5436:5432

    rabbitmq:
        image: rabbitmq:4-management
        container_name: rabbitmq
        restart: always
        environment:
            - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
            - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-guest}
            - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_VHOST:-/}
        ports:
            - "5672:5672"
            - "15672:15672"

    scheduler:
        build: ./docker/docker_php
        user: "${UID:-1000}:${GID:-1000}"
        userns_mode: "keep-id"
        environment:
            XDG_CONFIG_HOME: /tmp
        working_dir: /var/www/html
        command: php artisan schedule:work
        restart: always
        volumes:
            - .:/var/www/html
        depends_on:
            - php-fpm
            - postgres
            - rabbitmq

    reports-worker:
        build: ./docker/docker_php
        user: "${UID:-1000}:${GID:-1000}"
        userns_mode: "keep-id"
        environment:
            XDG_CONFIG_HOME: /tmp
        working_dir: /var/www/html
        command: >
            php artisan queue:work rabbitmq
            --queue=orders.reports.sales
            --tries=3
            --sleep=2
        restart: always
        volumes:
            - .:/var/www/html
        depends_on:
            - php-fpm
            - rabbitmq

    redis:
        image: redis:7-alpine
        ports:
            - "6379:6379"

    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0
        restart: unless-stopped
        environment:
            discovery.type: single-node
            xpack.security.enabled: "false"
            ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        mem_limit: 1g
        volumes:
            - elasticsearch-data:/usr/share/elasticsearch/data
        ports:
            - "127.0.0.1:9200:9200"
        healthcheck:
            test: [ "CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null" ]
            interval: 10s
            timeout: 10s
            retries: 12
            start_period: 30s

volumes:
    postgres_data:
    elasticsearch-data:
